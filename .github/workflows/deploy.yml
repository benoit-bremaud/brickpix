name: deploy

# Cloudflare Workers static assets (wrangler.jsonc): production on main, a disposable preview URL
# per pull request (= staging). Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts
# edit scope) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workers:
    name: cloudflare-workers
    runs-on: ubuntu-latest
    # Forks have no access to the secrets; their PRs build in ci.yml only.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Preview (pull request)
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Stable preview URL per pull request: pr-<N>-brickpix.<subdomain>.workers.dev
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }} --message "PR #${{ github.event.pull_request.number }} ${{ github.sha }}"
      - name: Production (main)
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
