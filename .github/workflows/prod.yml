# The only GitHub workflow of this repository (#53; agents-skills ADR-0004, local-first CI/CD, skill
# release-tag § Prod workflow, ADR-0001). Every check runs locally (`just check` on pre-push,
# `just gate` before merge, skill local-ci); GitHub Actions only promotes a signed stable release
# tag `vX.Y.Z` to production: the Cloudflare Worker `brickpix` (wrangler.jsonc, static assets).
#
# `classify` names the channel; only a stable tag reaches `deploy-production`, which re-fetches the
# tag and `main`, runs the trusted `scripts/attest.sh release` of `main` (SSH-signed tag against
# .github/allowed_signers, peel to the commit, status `gate` = success, signed `deploy/staging`
# note), then builds and deploys that commit, the same commands as the laptop fallback
# `just deploy prod <tag>`. A pre-release tag runs nothing (no publication channel); any other tag
# fails.
#
# Secrets: repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts edit, this account only, with an
# expiry) and CLOUDFLARE_ACCOUNT_ID, set on 2026-10-22 (ADR-0001: a `production` environment
# restricted to `v*` tags takes them over once the owner moves them).
name: prod
on:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: prod
  cancel-in-progress: false
env:
  PREFIX: v
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.c.outputs.channel }}
    steps:
      - id: c
        shell: bash
        run: |
          SEMVER='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          if [[ "$GITHUB_REF_NAME" =~ ^"$PREFIX"$SEMVER$ ]]; then echo channel=stable >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" =~ ^"$PREFIX"$SEMVER-(alpha|beta|rc)\.[1-9][0-9]*$ ]]; then echo channel=prerelease >> "$GITHUB_OUTPUT"
          else echo "::error::not a release tag: $GITHUB_REF_NAME"; exit 1; fi

  deploy-production:
    needs: classify
    if: needs.classify.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # fetch main, the tag and the notes refs
      statuses: read # attest.sh reads the commit status `gate`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # the deploy step runs tagged code: it never gets the token
      - name: Verify the tag, the gate status and the staging note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # git auth for this step only (fetches of main, the tag and the notes refs in attest.sh)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          # the annotated tag object itself (checkout may leave only the commit), then the trusted
          # attest.sh of main, never the tagged one
          git fetch --quiet --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" main
          git show origin/main:scripts/attest.sh > "$RUNNER_TEMP/attest.sh"
          sha=$(sh "$RUNNER_TEMP/attest.sh" release "$GITHUB_REF_NAME")
          [ "$sha" = "$(git rev-parse HEAD)" ] || { echo "::error::checkout is not $sha"; exit 1; }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # a release build never reads a cache another run could poison
      - name: Build
        # the same commands as just deploy prod <tag>; no secret in the env of the dependency and
        # build scripts
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
