# Local CI toolchain (#53, skill local-ci, ADR-0001): every CLI the justfile tiers and the lefthook
# hooks call, pinned; `mise.lock` pins the checksums. `just setup` installs it. System tools stay
# outside mise: sonar-scanner (not in the mise registry, skill infra-accounts) and docker (`just
# rehearse` runs act against it).
#
# Node follows the .nvmrc major (mise.lock pins the exact build, the nightly drift check flags a
# newer patch) and pnpm matches package.json#packageManager, so the hooks run the project's own
# toolchain whether or not the shell activates mise. Not here, on purpose (rule 1 of the skill):
# typos (the UI copy is French), osv-scanner and Trivy (`pnpm audit` already audits the lockfile;
# no Dockerfile), hadolint (no Dockerfile).
[tools]
node = "22"
pnpm = "10.30.3"
just = "1.59.0"
lefthook = "2.2.2"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
trufflehog = "3.99.8"
actionlint = "1.7.12" # prod.yml, the only workflow left
zizmor = "1.32.0"
jq = "1.8.2" # scripts/test-attest.sh applies the `gh api -q` filter through it
act = "0.2.92" # just rehearse; pinned: its log format is parsed (needs docker)
# Semgrep Community Edition (SAST, replaces CodeQL). pipx backend: the version is pinned, its Python
# dependencies are resolved at install time (accepted gap, ADR-0001).
"pipx:semgrep" = "1.184.0"

[env]
# The standalone pnpm binary ships its own CA bundle and refuses the certificate the Aikido
# safe-chain proxy presents for registry.npmjs.org (`pnpm audit`, `pnpm install`); the system
# bundle holds that CA (skill aikido-device-protection).
NODE_EXTRA_CA_CERTS = "/etc/ssl/certs/ca-certificates.crt"

[settings]
lockfile = true
