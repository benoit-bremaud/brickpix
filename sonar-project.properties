sonar.projectKey=brickpix
sonar.host.url=http://localhost:9000
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx,src/web/test-setup.ts,src/web/test-image.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Same list as coverage.exclude in vite.config.ts: bootstrap and test wiring carry no logic.
sonar.coverage.exclusions=src/web/main.tsx,src/web/test-setup.ts,src/web/test-image.ts
# Wait for the quality gate; pnpm sonar still runs scripts/sonar-status.sh when it fails.
sonar.qualitygate.wait=true
