sonar.projectKey=brickpix
sonar.host.url=http://localhost:9000
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx,src/web/test-setup.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Wait for the quality gate; pnpm sonar still runs scripts/sonar-status.sh when it fails.
sonar.qualitygate.wait=true
