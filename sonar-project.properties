sonar.projectKey=brickpix
sonar.host.url=http://localhost:9000
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx,src/web/test-setup.ts,src/web/test-image.ts,src/web/test-editor.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Same list as coverage.exclude in vite.config.ts: bootstrap and test wiring carry no logic.
sonar.coverage.exclusions=src/web/main.tsx,src/web/test-setup.ts,src/web/test-image.ts,src/web/test-editor.ts
# Block the scanner until the quality gate is reported: `just sonar` (step of `just gate`) fails when red.
sonar.qualitygate.wait=true
